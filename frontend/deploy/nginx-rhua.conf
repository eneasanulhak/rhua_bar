# Site do ADM RHUA no nginx do host.
# Fluxo: internet -> Traefik (Docker, :80/:443, HTTPS) -> este nginx (:8081)
#        -> arquivos estáticos do frontend + /api -> Gunicorn (127.0.0.1:8010)
# As portas 80/443 do servidor pertencem ao Traefik; por isso o nginx escuta
# numa porta interna e só aceita conexões locais e das redes Docker.
#
# Instalação:
#   sudo cp deploy/nginx-rhua.conf /etc/nginx/sites-available/rhua
#   sudo ln -s /etc/nginx/sites-available/rhua /etc/nginx/sites-enabled/rhua
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8081;
    server_name rhua.edasolutions.com.br;

    allow 127.0.0.1;
    allow 172.16.0.0/12;   # redes Docker (Traefik)
    deny all;

    # Build do frontend (npm run build), publicado por deploy/deploy-frontend.sh
    root /var/www/rhua;
    index index.html;

    # O Traefik termina o TLS. Não usar real_ip aqui: ele troca $remote_addr
    # pelo IP do visitante antes do allow/deny e bloquearia todo acesso externo.
    # O IP real segue para o backend em X-Forwarded-For.

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (vue-router em modo history): rotas desconhecidas caem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
